<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher's Day Greeting Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, #1a0520 0%, #0a0210 50%, #000 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,100,150,0.1);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffd700, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,215,0,0.85);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ffd700;
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .hint {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      margin-top: -14px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff5c7a, #d63050);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 25px rgba(214,48,80,0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(214,48,80,0.55);
    }
    button:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 22px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.5;
      text-align: center;
    }
    .preview {
      margin-top: 18px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: center;
      color: #ffd700;
      min-height: 40px;
    }
    .preview span {
      color: #ff9ff3;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎓 Teacher's Day Generator</h1>
    <p class="subtitle">Enter name → Download ready HTML greeting</p>

    <label for="nameEn">Teacher's Name (English)</label>
    <input id="nameEn" type="text" placeholder="e.g. name of teacher" value="teacher" autocomplete="off">

    <label for="nameOdia">Odia Pronunciation (for speech)</label>
    <input id="nameOdia" type="text" placeholder="e.g. ଶିକ୍ଷକଙ୍କ ନାମ" value="ଟିଚର" autocomplete="off">
    <p class="hint">Leave as is if you don't know Odia. It will still work.</p>

    <div class="preview" id="preview">
      HAPPY TEACHER'S DAY <span id="prevName">Teacher</span> SIR
    </div>

    <br>
    <button id="exportBtn">⬇️ Download HTML Greeting</button>

    <p class="note">
      The downloaded file is fully working.<br>
      Just open it in any browser and click/tap the screen.
    </p>
  </div>

  <script>
    const nameEnInput = document.getElementById('nameEn');
    const nameOdiaInput = document.getElementById('nameOdia');
    const prevName = document.getElementById('prevName');
    const exportBtn = document.getElementById('exportBtn');

    function updatePreview() {
      const name = (nameEnInput.value.trim() || 'SIR').toUpperCase();
      prevName.textContent = name;
    }

    nameEnInput.addEventListener('input', updatePreview);

    exportBtn.addEventListener('click', () => {
      let nameEn = nameEnInput.value.trim().toUpperCase() || 'SIR';
      let nameOdia = nameOdiaInput.value.trim() || nameEn;

      // Generate the full HTML
      const html = generateHTML(nameEn, nameOdia);

      // Download
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Happy_Teachers_Day_${nameEn}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function generateHTML(SIR_NAME_EN, SIR_NAME_ODIA) {
      return `<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Teacher's Day - ${SIR_NAME_EN} Sir</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #1a0520 0%, #0a0210 50%, #000 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      cursor: pointer;
      position: relative;
    }

    .bg-particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(255,200,100,0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(0.3); opacity: 0; }
    }

    #stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gift-wrap {
      position: relative;
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gift {
      width: 150px;
      height: 125px;
      position: relative;
      filter: drop-shadow(0 20px 40px rgba(200,50,80,0.5));
      transition: transform 0.4s ease;
    }
    .gift:active { transform: scale(0.96); }

    .lid {
      width: 160px;
      height: 42px;
      background: linear-gradient(180deg, #ff5c7a, #d63050);
      border-radius: 12px 12px 3px 3px;
      position: absolute;
      top: -6px;
      left: -5px;
      z-index: 2;
      transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .lid::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 42px;
      background: linear-gradient(90deg, #ffd700, #ffeaa7, #ffd700);
      left: 50%;
      transform: translateX(-50%);
    }
    .body {
      width: 150px;
      height: 105px;
      background: linear-gradient(180deg, #e8435a, #b02a3a);
      border-radius: 0 0 14px 14px;
      position: absolute;
      bottom: 0;
      box-shadow: inset 0 -12px 25px rgba(0,0,0,0.25);
    }
    .body::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffeaa7, #ffd700);
      left: 50%;
      transform: translateX(-50%);
    }
    .bow {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 2.8rem;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      transition: all 0.7s ease;
    }

    .opened .lid {
      transform: translateY(-130px) rotate(-42deg) scale(0.85);
      opacity: 0.85;
    }
    .opened .bow {
      transform: translateX(-50%) translateY(-55px) rotate(25deg) scale(1.3);
      opacity: 0.7;
    }
    .opened .gift-wrap {
      transform: scale(0.65) translateY(60px);
      opacity: 0.5;
      filter: blur(1px);
    }

    .msg {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95%;
      max-width: 900px;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .msg.fade {
      opacity: 0.85;
      transform: translate(-50%, -50%) scale(0.92);
    }
    .word {
      display: inline-block;
      font-size: clamp(2.4rem, 10vw, 6rem);
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 0.04em;
      text-shadow:
        0 0 15px rgba(255,215,0,0.9),
        0 0 40px rgba(255,180,0,0.6),
        0 0 80px rgba(233,69,96,0.4),
        0 6px 20px rgba(0,0,0,0.8);
      margin: 0 0.08em;
      opacity: 0;
      transform: scale(0.05) translateY(80px) rotate(-8deg);
      transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1.2;
    }
    .word.show {
      opacity: 1;
      transform: scale(1) translateY(0) rotate(0deg);
    }
    .word.name {
      color: #ff9ff3;
      text-shadow:
        0 0 15px rgba(255,159,243,0.95),
        0 0 40px rgba(255,120,200,0.6),
        0 0 70px rgba(200,50,120,0.4),
        0 6px 20px rgba(0,0,0,0.8);
    }

    .particle, .spark, .smoke {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
    }
    .particle { z-index: 30; }
    .spark {
      z-index: 31;
      width: 4px;
      height: 4px;
      background: #fff;
      box-shadow: 0 0 10px #ffd700, 0 0 20px #ff6b00;
    }
    .smoke {
      z-index: 25;
      background: radial-gradient(circle, rgba(140,140,140,0.5) 0%, transparent 70%);
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 3px solid rgba(255,200,50,0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      z-index: 4;
      pointer-events: none;
    }
    .ring.go { animation: ringOut 1.2s ease-out forwards; }
    @keyframes ringOut {
      0% { width: 10px; height: 10px; opacity: 1; border-width: 6px; }
      100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
    }

    .flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,230,120,0.95) 0%, rgba(255,100,40,0.6) 30%, transparent 65%);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
    }
    .flash.go { animation: flashOut 0.65s ease-out; }
    @keyframes flashOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .shake { animation: shake 0.6s ease-out; }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      12% { transform: translate(-12px, 7px); }
      25% { transform: translate(11px, -8px); }
      40% { transform: translate(-9px, 5px); }
      55% { transform: translate(7px, -4px); }
      70% { transform: translate(-4px, 3px); }
      85% { transform: translate(2px, -1px); }
    }

    .balloon {
      position: fixed;
      width: 52px;
      height: 64px;
      border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
      z-index: 45;
      pointer-events: none;
      opacity: 0.92;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
      will-change: transform, opacity;
    }
    .balloon::before {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      width: 12px;
      height: 10px;
      background: inherit;
      border-radius: 40%;
      transform: translateX(-50%);
      filter: brightness(0.75);
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 26px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0.15));
    }
    .balloon.heart {
      width: 48px;
      height: 44px;
      border-radius: 50% 50% 0 0;
      transform: rotate(-45deg);
    }
    .balloon.heart::before {
      width: 48px;
      height: 44px;
      border-radius: 50% 50% 0 0;
      left: 0;
      bottom: 0;
      transform: rotate(90deg);
      filter: none;
      background: inherit;
    }
    .balloon.heart::after {
      bottom: -28px;
      transform: translateX(-50%) rotate(45deg);
    }
    .balloon.long {
      width: 36px;
      height: 72px;
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    }

    body.finished {
      cursor: default;
    }
    body.finished .gift-wrap {
      opacity: 0;
      transform: scale(0.3) translateY(100px);
      transition: all 1.5s ease;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="gift-wrap" id="giftWrap">
      <div class="gift" id="gift">
        <div class="bow">🎀</div>
        <div class="lid"></div>
        <div class="body"></div>
        <div class="ring" id="ring"></div>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="flash" id="flash"></div>

  <script>
    const SIR_NAME_EN   = "${SIR_NAME_EN}";
    const SIR_NAME_ODIA = "${SIR_NAME_ODIA}";

    let ctx = null;
    function audio() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function bomb() {
      const a = audio();
      const t = a.currentTime;
      const c = a.createOscillator();
      const cg = a.createGain();
      c.type = 'square';
      c.frequency.setValueAtTime(220, t);
      c.frequency.exponentialRampToValueAtTime(40, t + 0.06);
      cg.gain.setValueAtTime(0.55, t);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      c.connect(cg); cg.connect(a.destination);
      c.start(t); c.stop(t + 0.08);

      const b = a.createOscillator();
      const bg = a.createGain();
      b.type = 'sine';
      b.frequency.setValueAtTime(85, t);
      b.frequency.exponentialRampToValueAtTime(25, t + 1.1);
      bg.gain.setValueAtTime(1.0, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
      b.connect(bg); bg.connect(a.destination);
      b.start(t); b.stop(t + 1.3);

      const s = a.createOscillator();
      const sg = a.createGain();
      s.type = 'sine';
      s.frequency.setValueAtTime(42, t);
      s.frequency.exponentialRampToValueAtTime(14, t + 1.6);
      sg.gain.setValueAtTime(0.9, t);
      sg.gain.exponentialRampToValueAtTime(0.001, t + 1.7);
      s.connect(sg); sg.connect(a.destination);
      s.start(t); s.stop(t + 1.7);

      const len = Math.floor(a.sampleRate * 0.75);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
      const n = a.createBufferSource();
      n.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(2400, t);
      f.frequency.exponentialRampToValueAtTime(70, t + 0.65);
      const ng = a.createGain();
      ng.gain.setValueAtTime(0.7, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      n.connect(f); f.connect(ng); ng.connect(a.destination);
      n.start(t);

      for (let i = 0; i < 12; i++) {
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = 'sawtooth';
        const freq = 900 + Math.random() * 1600;
        o.frequency.setValueAtTime(freq, t + 0.02 + i * 0.028);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.02 + i * 0.028 + 0.11);
        g.gain.setValueAtTime(0.06, t + 0.02 + i * 0.028);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.02 + i * 0.028 + 0.13);
        o.connect(g); g.connect(a.destination);
        o.start(t + 0.02 + i * 0.028);
        o.stop(t + 0.02 + i * 0.028 + 0.13);
      }
    }

    function bombDeep() {
      const a = audio();
      const t = a.currentTime;
      const b = a.createOscillator();
      const bg = a.createGain();
      b.type = 'sine';
      b.frequency.setValueAtTime(60, t);
      b.frequency.exponentialRampToValueAtTime(18, t + 1.4);
      bg.gain.setValueAtTime(1.2, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
      b.connect(bg); bg.connect(a.destination);
      b.start(t); b.stop(t + 1.6);

      const len = Math.floor(a.sampleRate * 0.9);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.3);
      const n = a.createBufferSource();
      n.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(1800, t);
      f.frequency.exponentialRampToValueAtTime(40, t + 0.8);
      const ng = a.createGain();
      ng.gain.setValueAtTime(0.85, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
      n.connect(f); f.connect(ng); ng.connect(a.destination);
      n.start(t);
    }

    function bombCrack() {
      const a = audio();
      const t = a.currentTime;
      for (let i = 0; i < 8; i++) {
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = 'square';
        const freq = 400 + Math.random() * 2200;
        o.frequency.setValueAtTime(freq, t + i * 0.015);
        o.frequency.exponentialRampToValueAtTime(60, t + i * 0.015 + 0.08);
        g.gain.setValueAtTime(0.12, t + i * 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.015 + 0.09);
        o.connect(g); g.connect(a.destination);
        o.start(t + i * 0.015);
        o.stop(t + i * 0.015 + 0.09);
      }
      const len = Math.floor(a.sampleRate * 0.35);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      const n = a.createBufferSource();
      n.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.setValueAtTime(800, t);
      const ng = a.createGain();
      ng.gain.setValueAtTime(0.5, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      n.connect(f); f.connect(ng); ng.connect(a.destination);
      n.start(t);
    }

    function bombWhooshBoom() {
      whoosh();
      setTimeout(() => bomb(), 80);
    }

    function whoosh() {
      const a = audio();
      const t = a.currentTime;
      const len = Math.floor(a.sampleRate * 0.28);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.2);
      const n = a.createBufferSource();
      n.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.setValueAtTime(200, t);
      f.frequency.exponentialRampToValueAtTime(2800, t + 0.18);
      const g = a.createGain();
      g.gain.setValueAtTime(0.28, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      n.connect(f); f.connect(g); g.connect(a.destination);
      n.start(t);
    }

    function pop() {
      const a = audio();
      const t = a.currentTime;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(620, t);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + 0.08);
    }

    function speakOdia(text) {
      return new Promise(async (resolve) => {
        if (!window.speechSynthesis || !text) { resolve(); return; }
        speechSynthesis.cancel();
        await new Promise(r => setTimeout(r, 50));

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'or-IN';
        u.rate = 0.82;
        u.pitch = 1.0;
        u.volume = 1;

        const voices = speechSynthesis.getVoices();
        const v =
          voices.find(x => /or-IN|or_/i.test(x.lang)) ||
          voices.find(x => /hi-IN|hi_/i.test(x.lang)) ||
          voices.find(x => /en-IN/i.test(x.lang)) ||
          voices.find(x => /IN/i.test(x.lang)) ||
          voices[0];
        if (v) u.voice = v;

        let finished = false;
        const done = () => { if (!finished) { finished = true; resolve(); } };
        u.onend = done;
        u.onerror = done;
        setTimeout(done, Math.max(1800, text.length * 220));
        speechSynthesis.speak(u);
      });
    }

    function bgDust() {
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'bg-particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.opacity = 0.15 + Math.random() * 0.3;
        document.body.appendChild(p);
      }
    }

    function explode(x, y) {
      const colors = ['#ff4500','#ff6b00','#ffd700','#ff1a00','#fff','#ff9f43','#ee5a24','#f368e0','#54a0ff'];
      for (let i = 0; i < 110; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 4 + Math.random() * 15;
        p.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px;background:'+colors[i%colors.length]+';box-shadow:0 0 '+size+'px '+colors[i%colors.length];
        const ang = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 280;
        const tx = Math.cos(ang) * dist, ty = Math.sin(ang) * dist - 25;
        const dur = 0.7 + Math.random() * 0.7;
        p.animate(
          [{ transform:'translate(0,0) scale(1)', opacity:1 }, { transform:'translate('+tx+'px,'+ty+'px) scale(0)', opacity:0 }],
          { duration: dur*1000, easing:'cubic-bezier(0.05,0.7,0.15,1)', fill:'forwards' }
        );
        document.body.appendChild(p);
        setTimeout(function(){ p.remove(); }, dur*1000 + 30);
      }
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = x + 'px'; s.style.top = y + 'px';
        const ang = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 190;
        s.animate(
          [{ transform:'translate(0,0)', opacity:1 }, { transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist)+'px)', opacity:0 }],
          { duration: 500 + Math.random()*500, easing:'ease-out', fill:'forwards' }
        );
        document.body.appendChild(s);
        setTimeout(function(){ s.remove(); }, 1100);
      }
      for (let i = 0; i < 16; i++) {
        const sm = document.createElement('div');
        sm.className = 'smoke';
        const size = 30 + Math.random() * 80;
        sm.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+(x-size/2)+'px;top:'+(y-size/2)+'px';
        const ang = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 100;
        sm.animate(
          [{ transform:'translate(0,0) scale(0.2)', opacity:0.5 }, { transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist-35)+'px) scale(1.8)', opacity:0 }],
          { duration: 1000 + Math.random()*800, easing:'ease-out', fill:'forwards' }
        );
        document.body.appendChild(sm);
        setTimeout(function(){ sm.remove(); }, 2000);
      }
    }

    function launchBalloons(count) {
      const colors = [
        '#ff4757', '#ff6b81', '#ffa502', '#ffd32a', '#2ed573',
        '#1e90ff', '#5352ed', '#ff6bff', '#ff9ff3', '#54a0ff',
        '#ff6348', '#eccc68', '#7bed9f', '#70a1ff', '#ff7f50'
      ];
      const types = ['', 'heart', 'long', '', 'heart', '', 'long'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const b = document.createElement('div');
          const type = types[Math.floor(Math.random() * types.length)];
          b.className = 'balloon' + (type ? ' ' + type : '');
          const color = colors[Math.floor(Math.random() * colors.length)];
          b.style.background = color;
          b.style.left = (8 + Math.random() * 84) + 'vw';
          b.style.bottom = '-80px';
          const sizeScale = 0.75 + Math.random() * 0.6;
          b.style.transform = 'scale(' + sizeScale + ')';
          document.body.appendChild(b);

          const drift = (Math.random() - 0.5) * 120;
          const rise = 110 + Math.random() * 40;
          const dur = 4.5 + Math.random() * 3.5;

          b.animate([
            { transform: 'translate(0,0) scale(' + sizeScale + ') rotate(0deg)', opacity: 0.95 },
            { transform: 'translate(' + (drift * 0.4) + 'px, -' + (rise * 0.35) + 'vh) scale(' + sizeScale + ') rotate(' + (Math.random()*12-6) + 'deg)', opacity: 0.95, offset: 0.35 },
            { transform: 'translate(' + drift + 'px, -' + rise + 'vh) scale(' + (sizeScale * 0.9) + ') rotate(' + (Math.random()*18-9) + 'deg)', opacity: 0.15 }
          ], {
            duration: dur * 1000,
            easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
            fill: 'forwards'
          });

          setTimeout(() => b.remove(), dur * 1000 + 50);
        }, i * 90 + Math.random() * 60);
      }
    }

    function closeAllAnimations() {
      document.querySelectorAll('.particle, .spark, .smoke, .balloon, .bg-particle').forEach(el => el.remove());
      const msg = document.getElementById('msg');
      if (msg) msg.classList.add('fade');
      document.body.classList.add('finished');
      if (window.speechSynthesis) speechSynthesis.cancel();
    }

    async function finale() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      bomb();
      explode(w * 0.5, h * 0.42);
      document.getElementById('flash').classList.remove('go');
      void document.getElementById('flash').offsetWidth;
      document.getElementById('flash').classList.add('go');
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 600);

      await new Promise(r => setTimeout(r, 280));

      bombDeep();
      explode(w * 0.28, h * 0.55);
      await new Promise(r => setTimeout(r, 220));

      bombCrack();
      explode(w * 0.72, h * 0.48);
      await new Promise(r => setTimeout(r, 200));

      bombWhooshBoom();
      explode(w * 0.5, h * 0.38);
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 500);

      launchBalloons(28);

      const extraBooms = [
        () => { bombCrack(); explode(w * (0.15 + Math.random()*0.2), h * (0.3 + Math.random()*0.4)); },
        () => { bombDeep(); explode(w * (0.65 + Math.random()*0.2), h * (0.25 + Math.random()*0.35)); },
        () => { bomb(); explode(w * (0.4 + Math.random()*0.2), h * (0.5 + Math.random()*0.25)); },
        () => { bombCrack(); explode(w * (0.2 + Math.random()*0.15), h * (0.6 + Math.random()*0.2)); },
        () => { bombWhooshBoom(); explode(w * (0.55 + Math.random()*0.25), h * (0.35 + Math.random()*0.3)); }
      ];

      for (let i = 0; i < extraBooms.length; i++) {
        await new Promise(r => setTimeout(r, 350 + Math.random() * 200));
        extraBooms[i]();
      }

      await new Promise(r => setTimeout(r, 400));
      bomb();
      bombDeep();
      explode(w * 0.5, h * 0.45);
      document.getElementById('flash').classList.remove('go');
      void document.getElementById('flash').offsetWidth;
      document.getElementById('flash').classList.add('go');
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 700);

      await new Promise(r => setTimeout(r, 5200));
      closeAllAnimations();
    }

    const parts = [
      { show: "HAPPY",       speak: "ହେପି",          delay: 180 },
      { show: "TEACHER'S",   speak: "ଟିଚର୍ସ୍",        delay: 650 },
      { show: "DAY",         speak: "ଡେ",            delay: 650 },
      { show: SIR_NAME_EN,   speak: SIR_NAME_ODIA,   delay: 700, name: true },
      { show: "SIR",         speak: "ସାର୍",          delay: 700, name: true }
    ];

    const fullSentenceOdia = \`ହେପି ଟିଚର୍ସ୍ ଡେ \${SIR_NAME_ODIA} ସାର୍\`;

    let started = false;

    async function go() {
      if (started) return;
      started = true;

      audio();
      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        await new Promise(function(r) {
          if (speechSynthesis.getVoices().length) r();
          else {
            speechSynthesis.onvoiceschanged = r;
            setTimeout(r, 600);
          }
        });
      }

      whoosh();
      document.body.classList.add('opened');
      document.getElementById('ring').classList.add('go');

      await new Promise(function(r){ setTimeout(r, 480); });

      const gift = document.getElementById('gift');
      const rect = gift.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      explode(cx, cy);
      bomb();
      document.getElementById('flash').classList.add('go');
      document.body.classList.add('shake');
      setTimeout(function(){ document.body.classList.remove('shake'); }, 650);

      const box = document.getElementById('msg');
      box.innerHTML = '';

      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        await new Promise(function(r){ setTimeout(r, p.delay); });
        const span = document.createElement('span');
        span.className = 'word' + (p.name ? ' name' : '');
        span.textContent = p.show;
        box.appendChild(span);
        span.offsetHeight;
        span.classList.add('show');
        pop();
        await speakOdia(p.speak);
      }

      await new Promise(function(r){ setTimeout(r, 400); });
      await speakOdia(fullSentenceOdia);

      await new Promise(r => setTimeout(r, 350));
      await finale();
    }

    bgDust();
    document.body.addEventListener('click', go, { once: true });
    document.body.addEventListener('touchend', go, { once: true, passive: false });
  <\/script>
</body>
</html>`;
    }
  </script>
</body>
